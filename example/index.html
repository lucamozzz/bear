<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <title>BEAR</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js-color-picker/colors/color-picker.css" />
  <link rel="icon" type="image/png" href="./icons/logo.png" />

  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BEAR" />
  <meta property="og:title" content="BEAR" />
  <meta property="og:url" content="https://bitbucket.org/proslabteam/bear/index.html" />

  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }

    body {
      color: #555;
    }

    a {
      color: #000;
      display: block;
      padding: 6px;
      margin: 12px;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      background-color: #FAFAFA;
      text-decoration: none;
    }

    #homeProgress {
      width: 100%;
    }

    #homeBar {
      width: 1%;
      height: 3px;
      background-color: #53d153;
    }

    a:hover {
      color: #FFF;
      background-color: #53d153;
    }
  </style>
</head>

<body>
  <div>
    <div style="width: 50%; margin-left: auto; margin-right: auto; text-align: center;">
      <img src="./icons/logo.png" alt="BEAR" style="width: 40%;">
    </div>
    <br>
    <div id="homeProgress">
      <div id="homeBar"></div>
    </div>
  </div>
  <script>
    var elem = document.getElementById("homeBar");
    var width = 1;
    var id = setInterval(frame, 10);
    function frame() {
      if (width >= 100) {
        clearInterval(id);
        window.location.replace("modeler.html");     // window.open("modeler.html", '_self');
      } else {
        width++;
        elem.style.width = width + '%';
      }
    }
  </script>
  <script src="./index.bundle.js"></script>
</body>

</html>
